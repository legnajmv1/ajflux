services:
  web:
    build: .
    image: ajflux:latest
    # Sin network_mode: host — gunicorn no necesita sockets raw (eso es cosa
    # de "monitor"). Publicar solo en 127.0.0.1 evita exponer el panel sin
    # HTTPS/dominio a cualquiera en internet (el túnel de Cloudflare llega
    # igual a este puerto una vez configurado).
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data:Z
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro,Z

  monitor:
    build: .
    image: ajflux:latest
    command: python manage.py run_monitor
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data:Z
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro,Z

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    network_mode: host
    restart: unless-stopped
    env_file: .env
